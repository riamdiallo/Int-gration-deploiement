name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Mettre en place le cache npm
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4. Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 5. Lancer les tests
      - name: Run tests
        run: npm test

      # 6. Écrire le résumé (même si les tests échouent)
      - name: Write job summary
        if: always()
        run: |
          echo "## Résultat de la CI" >> $GITHUB_STEP_SUMMARY
          echo "Statut : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Ref : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY